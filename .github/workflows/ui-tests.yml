name: UI tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run UI tests
        run: python -m pytest -q -m "not external" --html=report.html --self-contained-html
      - name: Compare fixed and condition-based waits
        run: python -m scripts.reliability_experiment --iterations 12 --output artifacts/reliability.json
      - name: Upload reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-evidence
          path: |
            report.html
            artifacts/
          if-no-files-found: warn

  external-demo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    timeout-minutes: 12
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install selected browser
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Run independent application tests
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: python -m pytest -q -m external --html=external-report.html --self-contained-html
      - name: Upload external test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-todomvc-report-${{ matrix.browser }}
          path: |
            external-report.html
            artifacts/
          if-no-files-found: warn
